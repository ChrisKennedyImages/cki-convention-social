name: tests
# Every push to main and every pull request runs the whole suite. A failure, an error or a skip fails the run.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: the eventcaliber.com Worker
        run: node tests/worker_test.mjs
      - name: run the suite against a throwaway home
        # several processes, each in a throwaway home of its own; a failure, an error or a skip fails it (bin/test-parallel.py)
        run: python -B bin/test-parallel.py
