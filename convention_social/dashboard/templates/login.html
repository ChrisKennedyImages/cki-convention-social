{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
{% if bad %}<div class="msg bad">That password did not match.</div>{% endif %}
<form method="post" action="/login" class="card">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Password</label><input type="password" name="password" autofocus autocomplete="current-password">
  <div class="row" style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
</form>
{% endblock %}
